name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test -c Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements-docs.txt
      - run: python3 -m openapi_spec_validator docs/openapi.yaml
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Publish
        run: |
          mkdir dist
          for rid in linux-x64 linux-arm64 win-x64; do
            dotnet publish src/Ldb.Api -c Release -r $rid --self-contained -p:PublishSingleFile=true -p:DebugType=None -o out/$rid
            cp README.md LICENSE SECURITY.md CHANGELOG.md out/$rid/
            cp -r docs tools out/$rid/
            if [ "$rid" = "win-x64" ]; then (cd out/$rid && zip -r ../../dist/lt-database-api-$rid.zip .)
            else tar -C out/$rid -czf dist/lt-database-api-$rid.tar.gz .; fi
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          repo=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -f docker/Dockerfile -t $repo:${GITHUB_REF_NAME#v} -t $repo:latest .
          docker push $repo:${GITHUB_REF_NAME#v}
          docker push $repo:latest
