version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      test-tooling:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet.*", "Testcontainers*", "Microsoft.AspNetCore.Mvc.Testing"]
      database-drivers:
        patterns: ["Npgsql*", "MySqlConnector*", "MongoDB.*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: "/docker"
    schedule: { interval: weekly }
